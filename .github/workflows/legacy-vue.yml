name: Legacy Vue CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/legacy-vue.yml"
  push:
    branches:
      - main
      - master
      - "codex/**"
    paths:
      - "frontend/**"
      - ".github/workflows/legacy-vue.yml"
  schedule:
    - cron: "23 19 * * 1"

jobs:
  frontend-legacy-vue:
    name: Legacy Vue Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
