# Style-reference candidate reranking policy.
#
# ``shadow`` is intentional until a frozen hidden human blind evaluation proves
# that this scorer improves style fidelity without lowering prose quality.  The
# service still computes and persists diagnostics, but only the independent
# plagiarism guard may alter order.  ``active`` additionally requires a valid
# activation_evidence block; changing only ``mode`` therefore fails closed.
mode: shadow

# Active mode is bounded: style can only arbitrate among candidates whose
# adversarial quality is within max_quality_drop of the best safe candidate.
style_weight: 0.18
max_quality_drop: 0.04
min_substantive_chars: 300
min_metric_count: 12
min_confidence: 0.65

# This guard uses the same normalized contiguous-overlap rule as validation.
plagiarism_guard: true
plagiarism_ngram_size: 8
plagiarism_threshold_chars: 12

# Required only for mode=active.  report_sha256 must be the SHA-256 of a frozen
# human-verified, policy-eligible blind-evaluation report.
activation_evidence:
  human_verified: false
  policy_evidence_eligible: false
  report_id: null
  report_sha256: null
