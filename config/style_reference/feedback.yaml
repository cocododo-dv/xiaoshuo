# 立项 B — finding 用户反馈(👍/👎)聚合 → confidence 持续校准规则。
# 设计:docs/style-reference-phase3-backlog.md「立项 B」。
#
# 聚合:net = (👍 去重用户数) − (👎 去重用户数)(每用户对每 finding 仅最新一票计入)。
# 调档(以 finding 合成时的 base_confidence 为基线,low < medium < high):
#   net >= promote_net  → 升一档(high 封顶)
#   net <= demote_net   → 降一档(low 触底)
#   其间                → 维持基线
# 仅 ±1 档(温和校准:用户反馈微调而非颠覆 LLM 合成的置信度);base_confidence 保留,
# 故 net 回到阈值内时 confidence 可逆回基线;profile 重合成产生新 finding(新基线)。
promote_net: 2
demote_net: -2
