suite_id: literary_small_v1
description: >
  Small original-fiction literary quality suite for checking whether generation
  can satisfy concrete motifs, abstract style cues, length bands, and banned
  moves. The suite also checks deep-revision signals: character contradiction,
  dialogue edge, image necessity, and ending drive. It avoids named-author
  imitation and focuses on transferable prose features.
pass_threshold: 0.72
cases:
  - case_id: reunion_pressure_gate
    title: Reunion pressure at the gate
    prompt: >
      Write a short scene in which two estranged leads meet at a city gate.
      Keep the prose tense, gesture-led, and concrete. A letter must change
      hands, but no one should explain the whole backstory.
    baseline_text: >
      The gate held its old iron breath. She kept the letter flat under her
      sleeve until his gesture stopped halfway to the latch. Tension gathered
      in the pause.

      "You kept it," he said.

      Neither of them explained the years between them; the paper did that,
      edge by edge, when she finally let it cross into his hand.
    required_terms: ["gate", "letter"]
    style_cues: ["gesture", "tension", "pause"]
    character_contradiction_cues: ["kept the letter", "finally let it cross"]
    dialogue_edge_cues: ["You kept it"]
    image_necessity_cues: ["paper did that", "cross into his hand"]
    ending_drive_cues: ["cross into his hand"]
    model_voice_banned_terms: ["somehow meaningful"]
    expository_dialogue_banned_terms: ["as you know"]
    choice_pressure_cues: ["finally let it cross"]
    summary_ending_banned_terms: ["everything changed forever"]
    image_variety_cues: ["gate", "letter", "paper"]
    banned_terms: ["woke up", "explained everything"]
    min_chars: 120
    max_chars: 700

  - case_id: archive_room_suspicion
    title: Archive room suspicion
    prompt: >
      Write a compact scene in an archive room where a character discovers a
      missing page. Use tactile imagery and short paragraph turns. The emotion
      should move from routine attention to suspicion.
    baseline_text: >
      Dust lifted when the archive drawer opened. Her thumb found the torn page
      before her eyes accepted it.

      Routine left first. Then suspicion.

      "Not missing," she said. "Chosen."

      She held the folder against the lamp, feeling the paper fibers catch and
      drag. Someone had not stolen a secret. Someone had made a door.
    required_terms: ["archive", "page"]
    style_cues: ["dust", "suspicion", "paper"]
    character_contradiction_cues: ["Routine left first", "suspicion"]
    dialogue_edge_cues: ["Chosen"]
    image_necessity_cues: ["torn page", "made a door"]
    ending_drive_cues: ["made a door"]
    model_voice_banned_terms: ["somehow meaningful"]
    expository_dialogue_banned_terms: ["as you know"]
    choice_pressure_cues: ["Chosen"]
    summary_ending_banned_terms: ["everything changed forever"]
    image_variety_cues: ["archive", "page", "paper"]
    banned_terms: ["dream", "randomly"]
    min_chars: 120
    max_chars: 700

  - case_id: dockside_cliffhanger
    title: Dockside cliffhanger
    prompt: >
      Write the last beat of a scene at a dock. The scene should end on a hard
      visual hook rather than summary. Use sparse dialogue and a clear emotional
      turn toward urgency.
    baseline_text: >
      Fog pressed the dock into pieces. The boatman would not look at the water.

      "Late," he said.

      Urgency went through her before fear did. Below the pier, a hand rose out
      of the black tide with her brother's ring shining on one finger.
    required_terms: ["dock", "ring"]
    style_cues: ["urgency", "fog", "hand"]
    character_contradiction_cues: ["would not look", "before fear did"]
    dialogue_edge_cues: ["Late"]
    image_necessity_cues: ["ring shining", "one finger"]
    ending_drive_cues: ["hand rose out", "ring shining"]
    model_voice_banned_terms: ["somehow meaningful"]
    expository_dialogue_banned_terms: ["as you know"]
    choice_pressure_cues: ["Urgency"]
    summary_ending_banned_terms: ["everything changed forever"]
    image_variety_cues: ["dock", "ring", "hand"]
    banned_terms: ["to be continued", "suddenly everything"]
    min_chars: 100
    max_chars: 650

  - case_id: chinese_archive_choice
    title: 中文档案室选择压力
    prompt: >
      写一个中文原创短场景：修复师在档案室听到录音，必须决定是否公开证据。
      场景要有反问、沉默和动作，不要解释完整前史。
    baseline_text: >
      林岚把录音倒回第三遍，证据袋的封口在她指腹下发出很轻的一响。
      她想公开，却把证据藏进袖口。

      许望站在门边问：“那你为什么先关门？”

      她没有回答，只把灯压暗。录音里停了两秒，第二段心跳声才从杂音里浮出来。
    required_terms: ["录音", "证据"]
    style_cues: ["反问", "沉默", "动作"]
    character_contradiction_cues: ["想公开", "藏进袖口"]
    dialogue_edge_cues: ["那你为什么先关门"]
    image_necessity_cues: ["证据袋", "封口"]
    ending_drive_cues: ["第二段心跳声"]
    model_voice_banned_terms: ["某种意义上"]
    expository_dialogue_banned_terms: ["你知道"]
    choice_pressure_cues: ["想公开"]
    summary_ending_banned_terms: ["一切都变了"]
    image_variety_cues: ["录音", "证据", "封口"]
    banned_terms: ["忽然意识到", "解释了一切"]
    min_chars: 90
    max_chars: 700

  - case_id: chinese_family_hook
    title: 中文家门口关系钩子
    prompt: >
      写一个中文原创短场景：多年不见的姐弟在旧屋门口交出钥匙。
      对白要克制但有刺，物件必须改变关系，结尾要推动下一章。
    baseline_text: >
      钥匙在姐姐掌心硌出一枚月牙。她说自己只是来还东西，却没有松手。

      弟弟看着门缝里的黑暗：“你怕我进去，还是怕我不进去？”

      她笑了一下，把钥匙放进他手里。门内随即响起母亲的咳嗽声，像有人一直醒着。
    required_terms: ["钥匙", "门缝"]
    style_cues: ["克制", "反问", "钩子"]
    character_contradiction_cues: ["只是来还东西", "没有松手"]
    dialogue_edge_cues: ["你怕我进去"]
    image_necessity_cues: ["钥匙放进他手里"]
    ending_drive_cues: ["母亲的咳嗽声"]
    model_voice_banned_terms: ["某种意义上"]
    expository_dialogue_banned_terms: ["你知道"]
    choice_pressure_cues: ["没有松手"]
    summary_ending_banned_terms: ["一切都变了"]
    image_variety_cues: ["钥匙", "门缝"]
    banned_terms: ["她很难过", "气氛十分尴尬"]
    min_chars: 90
    max_chars: 700

  - case_id: chinese_strong_plot_choice_cost
    title: 中文强情节选择代价
    prompt: >
      写一个中文原创短场景：档案修复师拿到能公开真相的录音，
      但公开会暴露幸存者位置。必须出现选择、代价和一个推动下一场的硬动作。
      不要用总结句解释主题。
    baseline_text: >
      林岑把录音卡按在证据袋下。许望伸手要拿，她没有松开。

      “公开它，阿砚的位置也会公开。”他说。

      她把录音卡掰成两片，一片塞进许望掌心，另一片藏进灯座裂缝。门外的脚步声停了，像有人终于确认他们在里面。
    required_terms: ["录音", "证据"]
    style_cues: ["动作", "克制", "压力"]
    character_contradiction_cues: ["公开", "没有松开"]
    dialogue_edge_cues: ["位置也会公开"]
    image_necessity_cues: ["录音卡掰成两片", "灯座裂缝"]
    ending_drive_cues: ["门外的脚步声停了"]
    model_voice_banned_terms: ["某种意义上", "她知道"]
    expository_dialogue_banned_terms: ["你知道"]
    choice_pressure_cues: ["公开它", "掰成两片"]
    summary_ending_banned_terms: ["解释了一切", "一切都变了"]
    image_variety_cues: ["录音卡", "证据袋", "灯座"]
    banned_terms: ["忽然意识到", "事情从此不同"]
    min_chars: 100
    max_chars: 760

  - case_id: chinese_strong_plot_ending_drive
    title: 中文强情节结尾驱动
    prompt: >
      写一个中文原创短场景结尾：人物必须延后公开证据以保护一个人，
      结尾用视觉动作推动下一章。对白要短，不能解释完整前史。
    baseline_text: >
      许望把钥匙推回桌面：“现在开门，里面的人就活不了。”

      林岑看着门缝里的光，没有替自己辩解。她明明该公开证据，却把证据袋贴上旧标签，写下一个假的编号。

      锁舌扣回去的瞬间，门外有人敲了三下。第三下之后，钥匙自己转了半圈。
    required_terms: ["钥匙", "证据"]
    style_cues: ["短对白", "视觉", "动作"]
    character_contradiction_cues: ["公开证据", "假的编号"]
    dialogue_edge_cues: ["活不了"]
    image_necessity_cues: ["旧标签", "锁舌"]
    ending_drive_cues: ["钥匙自己转了半圈"]
    model_voice_banned_terms: ["某种意义上", "她知道"]
    expository_dialogue_banned_terms: ["你知道"]
    choice_pressure_cues: ["现在开门", "假的编号"]
    summary_ending_banned_terms: ["解释了一切", "一切都变了"]
    image_variety_cues: ["钥匙", "证据袋", "锁舌"]
    banned_terms: ["真相必须", "忽然意识到"]
    min_chars: 90
    max_chars: 720
