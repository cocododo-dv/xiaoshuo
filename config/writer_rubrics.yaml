rubrics:
  drama_effectiveness_v1:
    title: "戏剧有效性"
    locale: zh
    score_scale:
      min: 0
      max: 1
    dimensions:
      desire: "人物是否有清晰、可被行动验证的欲望。"
      obstacle: "欲望前方是否有具体阻碍，而不是单纯说明困难。"
      stakes: "人物若失败会付出什么代价，读者能否感到风险。"
      turn: "场景是否发生了情势、认知或关系的转折。"
      subtext: "台词和动作下方是否有未说出口的真实意图。"
      irreversible_change: "结尾是否留下无法完全撤回的变化。"
      scene_necessity: "这一场是否对主线、人物或信息有不可替代作用。"
      reader_hook: "读者读完是否带着明确问题或期待进入下一段。"
      continuity: "场景是否承接既有事实、人物关系和章节承诺。"
    output_contract:
      required:
        - overall_score
        - scores
        - findings
        - revision_brief
        - requires_human_review
      missing_field_policy: "block_human_review"
