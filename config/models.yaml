model_profiles:
  local_fast:
    label: "快跑"
    role: "draft_and_low_risk_scan"
    description: "Use for local/offline drafts, preflight, and inexpensive scans."
  quality_strong:
    label: "精修"
    role: "quality_gate"
    description: "Use for scene quality contracts, character-scene rewrite, and near-final acceptance."
  dual_track:
    label: "双轨"
    role: "hybrid"
    description: "Use local_fast for speed-sensitive nodes and quality_strong for literary gates."

