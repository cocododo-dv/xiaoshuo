contract_version: BSHASH_v1
hash_alg: sha256
text_normalization:
  unicode: NFC
  line_ending: LF
  trim_trailing_spaces: true
  trim_outer_whitespace: true
json_canonicalization:
  pretty: false
  fixed_key_order: true
empty_values:
  scalar: null
  list: []
  map: {}
ordered_arrays:
  preserve:
    - ordered_injections
    - style_observations
    - calibration_lines
    - banned_rules
    - similar_scenes
unordered_arrays:
  sort_ascending:
    - resolved_ref_ids.relation_ids
    - resolved_ref_ids.world_rule_ids
    - resolved_ref_ids.open_foreshadow_ids
